[project]
name = "skin-lesion-classifier"
version = "0.1.0"
description = "Классификатор кожных заболеваний по дерматоскопическим изображениям (HAM10000)"
# readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "pytorch-lightning>=2.4.0",
    "albumentations>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=9.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "mlflow>=2.15.0",
    "dvc>=3.50.0",
    "fire>=0.6.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "dvc-gdrive>=3.0.0"
]

[project.scripts]
skin-lesion = "skin_lesion_classifier.commands:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skin_lesion_classifier"]

[dependency-groups]
dev = [
    "pre-commit>=3.7.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "dist"]
